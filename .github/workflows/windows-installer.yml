name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: "0"

      - run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: gradebook-windows-installer
          path: out/make/squirrel.windows/**/*
          if-no-files-found: error
          retention-days: 14
