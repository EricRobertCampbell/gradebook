name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    # windows-latest is now Server 2025 with Visual Studio 2026. The
    # @electron/node-gyp fork used by Electron Forge does not recognise VS 18,
    # so better-sqlite3 cannot compile. windows-2022 still has VS 2022.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # node-gyp prefers `py -3`, which on GitHub-hosted Windows currently
      # resolves to a Python that fails while compiling better-sqlite3.
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: "0"
          PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - run: npm run make
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: gradebook-windows-installer
          path: out/make/squirrel.windows/**/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          installer="$(find out/make/squirrel.windows -name '*Setup.exe' | head -n 1)"

          if [ -z "${installer}" ]; then
            echo "No Squirrel Setup.exe was found."
            exit 1
          fi

          for _ in $(seq 1 8); do
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${installer}" --clobber
              exit 0
            fi
            sleep 15
          done

          gh release create "${tag}" "${installer}" --title "Gradebook ${version}" --generate-notes
