name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # node-gyp prefers `py -3`, which on windows-latest currently resolves to
      # Python 3.14 and fails while compiling better-sqlite3.
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: "0"
          PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - run: npm run make
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: gradebook-windows-installer
          path: out/make/squirrel.windows/**/*
          if-no-files-found: error
          retention-days: 14
